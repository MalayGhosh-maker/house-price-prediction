services:
  backend:
    build: .
    container_name: house-price-api
    command: uvicorn Machine_Learning_model.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build: .
    container_name: house-price-ui
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - API_URL=http://backend:8000/predict
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: always